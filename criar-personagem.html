<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🧙 Criar Personagem - Crônicas de Aetheria</title>

<link rel="stylesheet" href="css/criar-personagem.css">

</head>


<body>


<header>

<h1>🧙 Criar Personagem</h1>

<p>Crônicas de Aetheria</p>

</header>



<main>


<section class="personagem-container">


<h2>⚔️ Novo Aventureiro</h2>



<form id="formPersonagem">



<label>
Nome do Personagem
</label>

<input 
type="text"
id="nomePersonagem"
placeholder="Ex: Lyra"
required>



<label>
Idade
</label>

<input 
type="number"
id="idade"
required>



<label>
Gênero
</label>

<select id="genero">

<option>Feminino</option>

<option>Masculino</option>

<option>Outro</option>

</select>



<label>
Raça
</label>

<select id="raca">

<option>Humano</option>

<option>Elfo</option>

<option>Anão</option>

<option>Orc</option>

</select>




<label>
Classe
</label>

<select id="classe">


<option>Mago</option>

<option>Guerreiro</option>

<option>Arqueiro</option>

<option>Paladino</option>


</select>




<label>
História do personagem
</label>


<textarea 
id="historia"
placeholder="Conte a história do seu herói...">
</textarea>




<button type="submit">

🧙 Criar Personagem

</button>



</form>


<p id="mensagem"></p>


</section>


</main>




<footer>

<p>
© 2026 - Crônicas de Aetheria
</p>

</footer>




<script src="js/criar-personagem.js"></script>


</body>

</html>
