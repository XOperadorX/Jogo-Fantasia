<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueceu a Senha - Crônicas de Aetheria</title>

    <link rel="stylesheet" href="css/esqueceu-senha.css">
</head>
<body>

    <div class="recuperar-container">

        <h1>⚔️ Crônicas de Aetheria ⚔️</h1>
        <h2>Recuperação de Senha</h2>

        <p>
            Informe o e-mail cadastrado para receber as instruções de
            recuperação da sua senha.
        </p>

        <form action="login.html" method="post">

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                required
            >

            <button type="submit">
                Enviar Link de Recuperação
            </button>

        </form>

        <hr>

        <div class="links">
            <a href="login.html">🔑 Voltar para o Login</a>
            <br><br>
            <a href="cadastro.html">📝 Criar uma Conta</a>
            <br><br>
            <a href="index.html">🏠 Página Inicial</a>
        </div>

    </div>

</body>
</html>
