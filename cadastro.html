```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📝 Cadastro - Crônicas de Aetheria</title>

<link rel="stylesheet" href="css/cadastro.css">

</head>


<body>


<header>

<h1>📝 Criar Conta</h1>

<p>Crônicas de Aetheria</p>

</header>



<main>


<section class="cadastro-container">


<h2>⚔️ Cadastro do Aventureiro</h2>



<form id="formCadastro">


<label>
👤 Nome do Jogador
</label>


<input 
type="text"
id="nome"
placeholder="Digite seu nome"
required>



<label>
🎮 Nome de Usuário
</label>


<input 
type="text"
id="usuario"
placeholder="Escolha um usuário"
required>



<label>
📧 E-mail
</label>


<input 
type="email"
id="email"
placeholder="Digite seu e-mail"
required>



<label>
🔐 Senha
</label>


<input 
type="password"
id="senha"
placeholder="Digite sua senha"
required>



<label>
🔐 Confirmar Senha
</label>


<input 
type="password"
id="confirmarSenha"
placeholder="Confirme sua senha"
required>



<button type="submit">

✨ Criar Conta

</button>



</form>



<p id="mensagem"></p>



<p>

Já possui conta?

<a href="login.html">
Entrar
</a>

</p>



</section>


</main>




<footer>

<p>
© 2026 - Crônicas de Aetheria
</p>

</footer>




<script src="js/cadastro.js"></script>


</body>

</html>
